<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <title>RecipeBook</title>
</head>

<body class="bg-[#FAF7EF] min-h-screen text-[#29291F]">
    <nav class="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between flex-wrap gap-4">
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight">
            🍃 Recipe<span class="text-[#78852F]">Book</span>
        </h1>
        <div class="flex items-center gap-2">
            <input type="text" id="recherche" placeholder="🔍 Search recipes..."
                class="w-40 sm:w-64 md:w-80 px-5 py-3 rounded-full border border-[#E8E4D8] bg-white outline-none focus:ring-2 focus:ring-[#89964B] shadow-sm">
            <button id="btnSearch" class="bg-[#78852F] text-white px-5 py-3 rounded-full hover:bg-[#68752D] transition">
                Search
          </button>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex items-center justify-between mb-8 flex-wrap gap-4">
            <div>
                <p class="text-sm text-[#78852F] font-semibold mb-2">
                    FRESH & DELICIOUS
                </p>

                <h2 class="text-3xl font-bold">
                    Explore Recipes
                </h2>
            </div>

            <p id="cunter" class="text-sm font-semibold text-[#68752D] bg-[#E9EBCF] px-4 py-2 rounded-full">
                Nombre de recettes : 0
            </p>
        </div>
        <div id="recipes" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        </div>
        <section class="mt-20 max-w-3xl mx-auto">
            <div class="text-center mb-8">
                <p class="text-sm text-[#78852F] font-semibold mb-2">
                    SHARE YOUR FOOD
                </p>
                <h2 class="text-3xl font-bold">
                    Add a New Recipe 🍽️
                </h2>
                <p class="text-gray-500 mt-2">
                    Share your favorite recipe with everyone.
                </p>
            </div>
            <div class="bg-white rounded-3xl shadow-sm border border-[#E8E4D8] p-6 md:p-10">
                <form id="recipeForm" class="space-y-6">
                    <div>
                        <label for="name" class="block text-sm font-semibold mb-2">
                            Recipe Name
                        </label>
                        <input type="text" id="name" placeholder="Enter recipe name"
                            class="w-full px-5 py-3 rounded-xl border border-[#E8E4D8] outline-none focus:ring-2 focus:ring-[#89964B] transition">

                        <p id="nameError" class="error text-red-500 text-sm mt-2"></p>
                    </div>
                    <div>
                        <label for="cooking" class="block text-sm font-semibold mb-2">
                            Cooking Method
                        </label>
                        <input type="text" id="cooking" placeholder="Example: Oven, Frying..."
                            class="w-full px-5 py-3 rounded-xl border border-[#E8E4D8] outline-none focus:ring-2 focus:ring-[#89964B] transition">
                        <p id="cookingError" class="error text-red-500 text-sm mt-2"></p>
                    </div>
                    <div>
                        <label for="difficulty" class="block text-sm font-semibold mb-2">
                            Difficulty
                        </label>
                        <select id="difficulty"
                            class="w-full px-5 py-3 rounded-xl border border-[#E8E4D8] bg-white outline-none focus:ring-2 focus:ring-[#89964B] transition">
                            <option value="">Select difficulty</option>
                            <option value="Easy">Easy</option>
                            <option value="Medium">Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                        <p id="difficultyError" class="error text-red-500 text-sm mt-2"></p>
                    </div>
                    <div>
                        <label for="time" class="block text-sm font-semibold mb-2">
                            Cooking Time (minutes)
                        </label>
                        <input type="number" id="time" min="1" max="300" placeholder="Example: 30"
                            class="w-full px-5 py-3 rounded-xl border border-[#E8E4D8] outline-none focus:ring-2 focus:ring-[#89964B] transition">
                        <p id="timeError" class="error text-red-500 text-sm mt-2"></p>
                    </div>
                    <button type="submit" id="submitBtn"
                        class="w-full bg-[#78852F] text-white font-semibold py-4 rounded-xl hover:bg-[#68752D] transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                        Add Recipe +
                    </button>
                </form>
                <p id="successMsg" class="text-center text-sm font-semibold mt-5"></p>
            </div>
        </section>
    </main>
    <footer class="text-center py-10 mt-12 border-t border-[#E8E4D8]">
        <p class="text-sm text-gray-500">
            Made with ♡ for food lovers
        </p>
        <p class="text-sm font-semibold text-[#78852F] mt-2">
            RecipeBook © 2026
        </p>
    </footer>
    <script src="../JS/API.js"></script>
    <script type="module" src="../JS/affichage.js"></script>
</body>
</html>
