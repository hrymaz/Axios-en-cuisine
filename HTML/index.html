
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <title>RecipeBook</title>
</head>

<body class="bg-[#FAF7EF] min-h-screen text-[#29291F]">

    <nav class="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between">

        <h1 class="text-2xl md:text-3xl font-bold tracking-tight">
            🍃 Recipe<span class="text-[#78852F]">Book</span>
        </h1>


        <div class="flex items-center gap-2">

            <input
                type="text"
                id="recherche"
                placeholder="🔍 Search recipes..."
                class="w-40 sm:w-64 md:w-80 px-5 py-3 rounded-full border border-[#E8E4D8] bg-white outline-none focus:ring-2 focus:ring-[#89964B] shadow-sm"
            >

            <button
                id="btnSearch"
                class="bg-[#78852F] text-white px-5 py-3 rounded-full hover:bg-[#68752D] transition">
                Search
            </button>

        </div>

    </nav>


    <main class="max-w-7xl mx-auto px-6 py-8">

        <div class="flex items-center justify-between mb-8">

            <div>
                <p class="text-sm text-[#78852F] font-semibold mb-2">
                    FRESH & DELICIOUS
                </p>

                <h2 class="text-3xl font-bold">
                    Explore Recipes
                </h2>
            </div>

            <p id="cunter"
                class="text-sm font-semibold text-[#68752D] bg-[#E9EBCF] px-4 py-2 rounded-full">
                Nombre de recettes : 0
            </p>

        </div>

    
        <div id="recipes"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        </div>

    </main>

    <footer class="text-center py-10 mt-12 border-t border-[#E8E4D8]">

        <p class="text-sm text-gray-500">
            Made with ♡ for food lovers
        </p>

        <p class="text-sm font-semibold text-[#78852F] mt-2">
            RecipeBook © 2026
        </p>

    </footer>

    <script src="../JS/API.js"></script>
    <script type="module" src="../JS/affichage.js"></script>

</body>
</html>
